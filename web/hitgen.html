<title>Wavejackers HitGen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&family=Unbounded:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#2fd6c6}
:root{
  --bg:#090b0e;--panel:#11151a;--panel2:#171c23;--ink:#eaf0f5;--mute:#8a96a4;--line:#242c37;--line2:#323c49;
  --accent:#4fb3a8;--accent-ink:#04100f;--focus:#9db4ff;
  --c-chords:#8790cc;--c-bass:#5db8a4;--c-drums:#d17a93;--c-melody:#cdae62;
  --roll:#0d1115;--grid:#1a2129;--grid2:#2a3440;
  --f-d:'Unbounded','Noto Sans Arabic','Noto Sans Devanagari','Arial Black',system-ui,sans-serif;--f-b:'Instrument Sans','Noto Sans Arabic','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;--f-m:'Martian Mono','Noto Sans Arabic','Noto Sans Devanagari',ui-monospace,Menlo,Consolas,monospace;--fs:1;
  --beat:.476s;color-scheme:dark;transition:--accent .7s ease;
}
:root[data-theme="light"]{
  --bg:#e8ecf0;--panel:#f7f9fb;--panel2:#edf1f5;--ink:#10161c;--mute:#566271;--line:#cdd5de;--line2:#b4bfcb;
  --accent-ink:#ffffff;--focus:#2d4bd6;
  --c-chords:#4558e8;--c-bass:#0b8f77;--c-drums:#d0295f;--c-melody:#b07a00;
  --roll:#eef2f6;--grid:#dde3ea;--grid2:#c3ccd7;color-scheme:light;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e8ecf0;--panel:#f7f9fb;--panel2:#edf1f5;--ink:#10161c;--mute:#566271;--line:#cdd5de;--line2:#b4bfcb;
  --accent-ink:#ffffff;--focus:#2d4bd6;
  --c-chords:#4558e8;--c-bass:#0b8f77;--c-drums:#d0295f;--c-melody:#b07a00;
  --roll:#eef2f6;--grid:#dde3ea;--grid2:#c3ccd7;color-scheme:light;}}
*{box-sizing:border-box}
html{background:var(--bg);font-size:calc(100% * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/1.5 var(--f-b);padding:18px 16px 56px}
.skip{position:absolute;left:12px;top:-60px;z-index:9;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:10px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.prefs{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;width:100%;justify-content:flex-end}
.pref{display:flex;flex-direction:column;gap:3px}
.pref select{padding:5px 8px;font-size:.78rem}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.rk{font:500 .62rem var(--f-m);color:var(--sa);margin-top:2px}
main:focus{outline:none}
:root[dir=rtl] .sty::after{left:auto;right:0}
:root[dir=rtl] .ar .t{text-align:left}
@media (forced-colors: active){.btn,.sty,.node,.card,.trk,.mod,.bc{border:1px solid CanvasText}.kn .vl{stroke:Highlight}.btn.on,.sty[aria-pressed=true]{outline:2px solid Highlight}.cables{display:none}}
button,select,input{font:inherit;color:inherit}
.app{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* üst çubuk */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{font:800 clamp(1.25rem,3.4vw,1.9rem)/1 var(--f-d);margin:0;letter-spacing:-.01em}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand span{font:400 .7rem var(--f-m);color:var(--mute)}
.tport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.play{min-width:108px;display:flex;align-items:center;justify-content:center;gap:8px}
.play svg{width:14px;height:14px;fill:currentColor}
.chipnum{font:500 .85rem var(--f-m);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;display:flex;gap:6px;align-items:baseline}
.chipnum small{color:var(--mute);font-size:.66rem}
.chipnum input{width:5.2ch;background:none;border:0;padding:0;font:inherit;text-align:right}
.chipnum input:focus-visible{outline-offset:4px;border-radius:3px}
/* kablo şeridi */
.path{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px 18px 16px;overflow:hidden}
.path::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 0% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);pointer-events:none}
.nodes{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,5vw,68px)}
.node{position:relative;z-index:1;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:border-color .2s,transform .2s}
.node:hover{border-color:var(--accent)}
.node b{font:700 .78rem var(--f-d)}
.node small{font:400 .68rem var(--f-m);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--tc);opacity:.35}
.node.hit .dot{animation:blink .22s ease-out}
.node.hit{border-color:var(--tc)}
.node .jk{position:absolute;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.node .jk.l{left:-6px}.node .jk.r{right:-6px}
.node:first-child .jk.l,.node:last-child .jk.r{display:none}
@media (max-width:640px){.nodes{grid-template-columns:1fr 1fr;gap:30px 36px}.node .jk{display:none}}
@keyframes blink{0%{opacity:1;box-shadow:0 0 0 0 var(--tc)}100%{opacity:.35;box-shadow:0 0 0 9px transparent}}
.cables{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.cables path{fill:none;stroke-linecap:round}
.cables .c1{stroke:var(--line2);stroke-width:5}
.cables .c2{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 12;animation:flow var(--beat) linear infinite;animation-play-state:paused}
body.playing .cables .c2{animation-play-state:running}
@keyframes flow{to{stroke-dashoffset:-15}}
.strip{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.strip canvas{flex:1;min-width:140px;height:34px;display:block}
.strip .st{font:400 .7rem var(--f-m);color:var(--mute)}
/* sekmeler */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font:600 .92rem var(--f-b);color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.pane[hidden]{display:none}
.pane{display:flex;flex-direction:column;gap:16px}
/* stil duvarı */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.sty{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;transition:border-color .2s,transform .2s}
.sty::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sa)}
.sty b{font:700 .86rem/1.2 var(--f-d)}
.sty span{font:400 .7rem var(--f-m);color:var(--mute)}
.sty:hover{transform:translateY(-2px);border-color:var(--sa)}
.sty[aria-pressed="true"]{border-color:var(--sa);background:color-mix(in srgb,var(--sa) 10%,var(--panel))}
.sty small{font-size:.74rem;color:var(--mute);line-height:1.35;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:700 .95rem var(--f-d);margin:0}
.card p{margin:0;color:var(--mute);font-size:.88rem;max-width:72ch}
.card p b{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lab{font:400 .72rem var(--f-m);color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.lab em{font-style:normal;color:var(--ink)}
select,.txt{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:500 .86rem var(--f-m)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.vars .btn{flex:1 1 auto;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 12px;min-width:110px}
.vars .btn small{font:400 .66rem/1.3 var(--f-m);color:var(--mute);font-weight:400}
.vars .btn.on small{color:var(--ink)}
.checkrow{display:flex;align-items:center;gap:8px;font-size:.88rem}
.checkrow input{accent-color:var(--accent);width:16px;height:16px}
.prog{display:flex;flex-wrap:wrap;gap:8px}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:76px;transition:border-color .1s,background .1s}
.pc b{font:700 1.05rem var(--f-d);display:block}
.pc span{font:400 .66rem var(--f-m);color:var(--mute)}
.pc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.meta{font:400 .74rem var(--f-m);color:var(--mute)}
/* izler */
.trk{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap}
.th i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.th b{font:700 .84rem var(--f-d)}
.th .inf{font:400 .68rem var(--f-m);color:var(--mute);flex:1;min-width:120px}
.sr{display:flex;gap:8px;padding:0 12px 9px;align-items:center}
.sr select{padding:5px 8px;font-size:.78rem}
.wrap{position:relative}
.roll{display:block;width:100%;background:var(--roll);border-top:1px solid var(--line)}
.ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--accent);display:none;pointer-events:none;box-shadow:0 0 12px var(--accent)}
.drag{font:400 .72rem var(--f-m);border:1px dashed var(--line2);border-radius:8px;padding:5px 9px;cursor:grab;user-select:none;background:var(--panel2)}
.drag:hover{border-color:var(--accent)}
.drag.big{display:block;text-align:center;padding:14px;font-size:.8rem}
/* ses tasarımı */
.synth{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.mod{grid-column:span 4;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod.w6{grid-column:span 6}.mod.w8{grid-column:span 8}.mod.w12{grid-column:span 12}
@media (max-width:980px){.mod,.mod.w6,.mod.w8{grid-column:span 6}}
@media (max-width:640px){.mod,.mod.w6,.mod.w8{grid-column:span 12}}
.mod h3{font:700 .78rem var(--f-d);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:8px 4px}
.kn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;touch-action:none;user-select:none}
.kn .k{width:50px;height:50px;position:relative;cursor:ns-resize;border-radius:50%}
.kn svg{width:100%;height:100%;display:block}
.kn .tr{stroke:var(--line2);fill:none;stroke-width:4;stroke-linecap:round}
.kn .vl{stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round}
.kn .nd{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.kn label{font:400 .66rem var(--f-m);color:var(--mute);text-align:center;cursor:default}
.kn output{font:500 .68rem var(--f-m);color:var(--ink)}
.oscrow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.cv{display:block;width:100%;border-radius:10px;background:var(--roll);border:1px solid var(--line)}
.tg{display:flex;gap:5px;flex-wrap:wrap}
.tg .btn{padding:4px 9px;font-size:.76rem;border-radius:7px}
.kbd{position:relative;height:96px;user-select:none;touch-action:none}
.kbd .wk{position:absolute;top:0;bottom:0;background:#f1f4f7;border:1px solid #98a3af;border-radius:0 0 6px 6px;cursor:pointer}
.kbd .bk{position:absolute;top:0;height:60%;background:#12171c;border:1px solid #000;border-radius:0 0 4px 4px;cursor:pointer;z-index:2}
.kbd .wk.dn{background:var(--accent)}.kbd .bk.dn{background:var(--accent)}
.kbd small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:400 .56rem var(--f-m);color:#59636e;pointer-events:none}
.sel3{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* banka */
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.bc{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:9px 11px;display:flex;flex-direction:column;gap:7px;justify-content:space-between;min-width:0}
.bc b{font-size:.9rem;font-weight:600;overflow-wrap:anywhere}
.bc span{font:400 .64rem var(--f-m);color:var(--mute)}
.bc .bb{display:flex;gap:5px;flex-wrap:wrap}
.bc.sig{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
/* aranjman */
.arr{display:grid;gap:6px}
.ar{display:grid;grid-template-columns:minmax(70px,104px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.ar .tl{height:12px;background:var(--grid);border-radius:4px;position:relative}
.ar .tl i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--sc)}
.ar .t{font:400 .68rem var(--f-m);color:var(--mute);text-align:right;white-space:nowrap}
.mx{display:grid;grid-template-columns:minmax(70px,104px) repeat(4,minmax(0,1fr));gap:3px;font:400 .66rem var(--f-m);color:var(--mute);align-items:center}
.mx i{display:block;height:9px;border-radius:3px;background:var(--grid)}
.mx i.on{background:var(--tc)}
.daws{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.daw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.daw b{font:700 .76rem var(--f-d)}
.daw span{display:block;font-size:.8rem;color:var(--mute);margin-top:3px}
.toast{font:400 .76rem var(--f-m);color:var(--mute);min-height:1.3em;overflow-wrap:anywhere}
.fine{font-size:.78rem;color:var(--mute);max-width:84ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hello{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* 2.3: renkli, hareketli arayüz */
body{background:var(--bg);position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:
 radial-gradient(38% 42% at 18% 22%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),
 radial-gradient(34% 40% at 82% 18%,color-mix(in srgb,var(--c-drums) 10%,transparent),transparent 70%),
 radial-gradient(40% 44% at 70% 86%,color-mix(in srgb,var(--c-chords) 11%,transparent),transparent 70%),
 radial-gradient(30% 36% at 22% 80%,color-mix(in srgb,var(--c-melody) 8%,transparent),transparent 70%);
 animation:aur 26s ease-in-out infinite alternate;filter:saturate(.9)}
@keyframes aur{0%{transform:translate3d(-3%,-2%,0) rotate(0) scale(1)}50%{transform:translate3d(3%,2%,0) rotate(4deg) scale(1.08)}100%{transform:translate3d(-1%,3%,0) rotate(-3deg) scale(1.03)}}
:root[data-motion="off"] body::before{animation:none}
.path,.trk,.card,.mod{backdrop-filter:blur(10px) saturate(1.2);background-color:color-mix(in srgb,var(--panel) 82%,transparent)}
.brand h1 i{background:linear-gradient(100deg,var(--accent),var(--c-chords),var(--c-drums),var(--accent));background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:240% 0}}
:root[data-motion="off"] .brand h1 i{animation:none;color:var(--accent);background:none}
.btn.pri{background:linear-gradient(100deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--c-chords)));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 18%,transparent)}
.btn.pri.playing,.btn.pri[aria-pressed=true]{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px color-mix(in srgb,var(--accent) 38%,transparent)}}
:root[data-motion="off"] .btn.pri{animation:none}
.trk{border-left:3px solid var(--tc);transition:box-shadow .3s}
.trk:hover{box-shadow:0 0 26px color-mix(in srgb,var(--tc) 25%,transparent)}
.btn.alt{white-space:nowrap;border-color:color-mix(in srgb,var(--tc,var(--accent)) 60%,var(--line2));color:var(--tc,var(--accent))}
.btn.alt.spin{animation:spin .6s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.meter{position:relative;width:150px;height:8px;border-radius:5px;background:var(--line);overflow:hidden;align-self:center}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--c-bass),var(--accent) 70%,var(--c-melody) 88%,var(--c-drums));transition:width .05s linear}
.meter b{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--ink)}
.node:hover,.sty:hover{box-shadow:0 0 22px color-mix(in srgb,var(--tc,var(--accent)) 28%,transparent)}
@media (prefers-reduced-motion: reduce){body::before,.brand h1 i,.btn.pri{animation:none!important}}

/* fikir kartları */
.ideas{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--panel) 85%,transparent)}
.idh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.idg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:10px}
.idg:empty{display:none}
.idc{border:1px solid var(--line2);border-radius:12px;padding:8px 10px;background:var(--panel2);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:border-color .2s,transform .2s}
.idc:hover{border-color:var(--accent);transform:translateY(-2px)}
.idc b{font:700 .74rem var(--f-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idc small{font:400 .64rem var(--f-m);color:var(--mute);line-height:1.35}
.idc canvas{width:100%;height:34px;border-radius:6px;background:var(--roll)}
.idc.cur{border-color:var(--accent)}
</style>
<body>
<a class="skip" href="#main" data-i="skip">Skip to content</a>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Wavejackers <i>HitGen</i></h1>
      <span data-i="tagline">MIDI generator and sound design station</span>
    </div>
    <div class="meter" role="img" data-ia="level" aria-label="Output level (ceiling -1 dBFS)"><i id="mt"></i><b id="mh"></b></div>
    <div class="tport">
      <button class="btn pri play" id="play" type="button" aria-pressed="false"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="playico" d="M3 1.5v11l9-5.5z"/></svg><span id="playtxt" data-i="play">Play</span></button>
      <label class="chipnum"><small data-i="bpm">BPM</small><input id="bpm" type="number" min="60" max="190" step="1" value="126"></label>
      <label class="chipnum"><small data-i="seed">Seed</small><input id="seed" type="text" inputmode="numeric" value="7" style="width:6ch"></label>
      <button class="btn" id="gen" type="button" aria-keyshortcuts="N" data-i="newIdea">New idea</button>

// ---- Tonalite bilgisi: Camelot kodu, uyumlu tonlar, gam notaları, MIDI anahtar imzası
MB.keyInfo = function (key, scale) {
  const off = { major: 0, minor: 3, dorian: 10, phrygian: 8, mixolydian: 5, harmonic: 3, hijaz: 8 }[scale];
  const rp = (key + off) % 12;                         // ilişkili majör tonik
  const num = ((7 + (rp * 7) % 12) % 12) + 1;
  const letter = (scale === 'major' || scale === 'mixolydian') ? 'B' : 'A';
  const other = letter === 'A' ? 'B' : 'A';
  const up = num % 12 + 1, down = ((num + 10) % 12) + 1;
  return {
    cam: num + letter,
    compat: [down + letter, up + letter, num + other],
    sf: ((rp * 7 + 6) % 12) - 6,
    mi: (scale === 'minor' || scale === 'harmonic' || scale === 'hijaz') ? 1 : 0,
    notes: MB.SCALES[scale].iv.map(i => MB.NOTES[(key + i) % 12])
  };
};
// ---- MIDI yazıcı: SMF format 1 (varsayılan) ve format 0, tüm DAW'larda açılacak şekilde
MB.PPQ = 480;
MB.CH = { chords: 0, bass: 1, melody: 2, drums: 9 };
MB.TNAME = { chords: 'Chords', bass: 'Bass', melody: 'Melody', drums: 'Drums' };
(function () {
  const STEP = MB.PPQ / 4;
  const vlq = n => {
    const b = [n & 0x7f]; n >>= 7;
    while (n > 0) { b.unshift((n & 0x7f) | 0x80); n >>= 7; }
    return b;
  };
  const str = s => Array.from(unescape(encodeURIComponent(s))).map(c => c.charCodeAt(0));
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const u16 = n => [(n >> 8) & 255, n & 255];
  const tickOf = (s, sw) => {
    const sh = (Number.isInteger(s) && s % 2 === 1) ? (sw / 100) * STEP : 0;
    return Math.round(s * STEP + sh);

  const meta = (t, type, bytes) => ({ t, o: -1, b: [0xFF, type].concat(vlq(bytes.length), bytes) });
  const chunk = (id, body) => id.split('').map(c => c.charCodeAt(0)).concat(u32(body.length), body);

  function headEvents(res, title) {
    const P = res.P, us = Math.round(60000000 / P.bpm), ki = MB.keyInfo(P.key, P.scale);
    const ev = [
      meta(0, 0x03, str(title)),
      meta(0, 0x51, [(us >> 16) & 255, (us >> 8) & 255, us & 255]),
      meta(0, 0x58, [4, 2, 24, 8]),
      meta(0, 0x59, [ki.sf & 255, ki.mi])
    ];
    (res.sections || []).forEach(sc => ev.push(meta(sc.bar * 16 * STEP, 0x06, str(sc.name))));   // bölüm işaretçileri (tam parça): Intro, Build, Drop...
    res.chords.forEach((c, b) => ev.push(meta(b * 16 * STEP, 0x06, str(c.name))));
    return ev;

  function noteEvents(res, key) {
    const P = res.P, ch = MB.CH[key], H = (P.human || 0) / 100;
    const rj = MB.rng(P.seed * 977 + key.length * 13);
    const ev = [];
    for (const n of res.tracks[key]) {
      let on = tickOf(n.s, P.swing);
      let off = tickOf(n.s + n.l, P.swing) - 2;          // 2 tick boşluk: aynı notalar üst üste binmez
      const jit = (key === 'drums' && n.n === MB.GM.kick) ? 0 : Math.round(rj() * H * STEP * 0.45);
      on = Math.min(on + jit, Math.max(on, off - 1));
      if (off <= on) off = on + 1;
      ev.push({ t: on, o: 1, b: [0x90 | ch, n.n, n.v] }, { t: off, o: 0, b: [0x80 | ch, n.n, 0] });

    const out = []; let last = 0;
    for (const e of ev) { out.push.apply(out, vlq(e.t - last).concat(e.b)); last = e.t; }
    out.push.apply(out, vlq(Math.max(0, total - last)).concat([0xFF, 0x2F, 0x00]));

    const title = 'Wavejackers HitGen ' + MB.NOTES[P.key] + ' ' + MB.SCALES[P.scale].n + ' ' + P.bpm + ' BPM';

      trks = [chunk('MTrk', pack(ev, total))];
    } else {
      trks = [chunk('MTrk', pack(headEvents(res, title), total))];
      keys.forEach(k => {

        trks.push(chunk('MTrk', pack(ev, total)));

ft","dmMid":"Mid","dmHigh":"High","dmLevelHint":"Volume of this pad.","dmTuneHint":"Pitch in semitones.","dmDecayHint":"Length of the tail.","dmPunchHint":"Attack strength. Above 50% the hit is harder and the kick sweep deeper; below 50% it is rounder.","dmSoftHint":"Softens the hit: slower attack, darker tone, less drive and click.","dmMidHint":"Boost or cut the body (kick 350 Hz, snare 900 Hz, hats 3 kHz).","dmHighHint":"Boost or cut the top end (air, click, sizzle).","pLoud":"Loudness -14 LUFS","pLoudHint":"Keeps the output near -14 LUFS (streaming level) with a -1 dBFS peak limiter. Off: the earlier soft limiter.","asName":"Assistant","asTip":"Your one-eyed assistant: click for suggestions.","asFooter":"Suggestions come from rules that read the plugin's own settings. No internet, no cloud.","asNext":"Next","asClose":"Close","asApply":"Apply","asOk":"Got it","asCounter":"Suggestion {i} of {n}","asDone":"Applied: {t}","as_play_t":"Listen first","as_play":"Pick a style on the left and press Play (Space). When your DAW plays, HitGen follows its tempo.","as_loud_t":"Turn on -14 LUFS","as_loud":"Loudness normalisation is off. Turn it on so the output sits near -14 LUFS with a -1 dBFS ceiling.","as_swing_t":"Add swing","as_swing":"Afro grooves breathe with a little swing. Set Swing to 10%.","as_hook_t":"Use a short hook","as_hook":"This variation writes a long melody. In the club a short, repeated hook usually works better. Apply switches to a variation with a short motif.","as_bars_t":"Use 8 bars","as_bars":"4 bars can feel short for a club loop. 8 bars gives the hook room to answer itself.","as_energy_t":"Raise the energy","as_energy":"Energy is low, so hats and kicks are thinned out. Around 65% suits the club.","as_pump_t":"Add sidechain pump","as_pump":"Sidechain pump is almost off. In house and techno 60–100% keeps the bass and chords moving with the kick.","as_thick_t":"More weight","as_thick":"Thickness is low. At 70% a root note is added under the chords.","as_creative_t":"Build your own kit","as_creative":"Turn on Creative mode to load your own samples and use Punch, Soft, Mid and High.","as_sample_t":"Drop a sample","as_sample":"Drag a WAV or AIFF from your computer onto a pad. Start with your favourite kick.","as_ref_t":"Load a reference","as_ref":"Drag a song onto the window. Tempo, key and regions are found automatically; then extract its DNA.","as_cpu_t":"Lighten the CPU","as_cpu":"The CPU load is high. Eco performance uses fewer unison voices.","as_drums_t":"Try the drum machine","as_drums":"The new drum machine has analog kick, snare, clap, hats, rim and percussion. You can also load your own samples.","as_drag_t":"Drag MIDI to your DAW","as_drag":"Drag any track tile (Chords .mid, Bass .mid...) or the Loop and Full track tiles straight into your DAW.","as_learn_t":"Map a controller","as_learn":"Right-click any knob and choose MIDI Learn, then move a knob on your controller.","as_newidea_t":"New idea","as_newidea":"Press N for a new idea: seed, variation, key, energy and tempo change together within the style.","gdStart":"Start the guide","gdBack":"Back","gdNext":"Next","gdDone":"Finish","gdSkip":"Skip","gdStep":"Step {i} of {n}","hdHelpTips":"Shortcuts and tips","gd1_t":"Welcome to HitGen","gd1":"In about a minute you will know the basics: choose a style, listen, get new ideas, shape the sounds and drag MIDI into your DAW. Press Next or the right arrow key.","gd2_t":"1. Choose a style","gd2":"Each artist-inspired style has its own tempo, harmony, groove and sounds. Filter by genre at the top and try the four variations below.","gd3_t":"2. Listen","gd3":"Play (or Space) previews the loop. When your DAW is playing, HitGen follows the DAW tempo automatically.","gd4_t":"3. New ideas","gd4":"New idea (N) changes the seed, variation, key, energy and tempo together. The seed box lets you go back to an idea you liked.","gd5_t":"4. Tracks and sounds","gd5":"Each track has its own sound. Change it from the list; the ↻ button rewrites only that track's MIDI. The piano roll shows what will be exported.","gd6_t":"5. Drag into your DAW","gd6":"Drag a track tile, the Loop or the Full track straight into your DAW. Press Enter on a tile to save it as a file.","gd7_t":"6. Drum machine","gd7":"Seven analog pads: kick, snare, clap, hi-hat, open hat, rim and percussion. Turn on Creative mode and drop your own samples onto the pads to build a kit.","gd8_t":"7. Shape every pad","gd8":"Punch makes the hit harder, Soft rounds it, Mid and High are EQ. Tune and Decay change pitch and length. Save the result with Save kit.","gd9_t":"8. Reference and DNA","gd9":"Drag a song here: tempo, key and regions are detected. DNA measures a region's sound and Generate designs a similar synth sound. The audio is never copied.","gd10_t":"9. Sound design","gd10":"Every parameter of the chord, bass and melody sounds: oscillators, filter, envelopes, LFOs and effects. You can also import Serum 2 presets.","gd11_t":"10. Your assistant","gd11":"This one-eyed character gives suggestions based on your current settings. A yellow dot means it has something new. Apply changes the setting for you.","gd12_t":"Ready","gd12":"Output is kept near -14 LUFS (Settings). Right-click a knob for MIDI Learn. Help or F1 opens this guide again."});
Object.assign(HG.I18N.tr, {"navDrums":"Davul makinesi","dmTitle":"Davul makinesi","dmCreative":"Yaratıcı mod","dmCreativeHint":"Açık: kendi kitin çalar (örnekler ve ped ayarları). Kapalı: stilin analog kiti çalar.","dmKit":"Analog kit","dmKitHint":"Analog temel kit. Örnek yüklenmemiş pedler bu kiti çalar.","dmSaveKit":"Kiti kaydet","dmSaveKitHint":"Ped ayarlarını ve örnek yollarını .hgkit dosyası olarak kaydet.","dmLoadKit":"Kit yükle","dmLoadKitHint":"Kaydettiğin kitlerden birini yükle.","dmReset":"Pedleri sıfırla","dmResetHint":"Tüm ped ayarları varsayılana döner, örnekler kaldırılır.","dmResetDone":"Tüm pedler sıfırlandı.","dmHintOn":"Yaratıcı mod açık: bir pede WAV, AIFF, FLAC ya da MP3 sürükle veya Örnek yükle'yi kullan. Her pedi Punch, Soft, Mid ve High ile şekillendir. Dinlemek için pede tıkla.","dmHintOff":"Stilin analog kiti çalıyor. Örneklerle kendi kitini kurmak ve ped ayarlarını kullanmak için Yaratıcı modu aç. Dinlemek için pede tıkla.","dmPadHint":"Dinlemek için tıkla ya da Boşluk'a bas. Yüklemek için buraya bir ses dosyası bırak (Yaratıcı mod).","dmLoad":"Örnek yükle","dmLoadHint":"Bu ped için bir ses dosyası seç (en çok 12 saniye).","dmClear":"Örneği kaldır","dmCleared":"{p} pedinden örnek kaldırıldı; analog ses yeniden çalıyor.","dmAnalog":"Analog","dmDrop":"Yüklemek için bırak","dmLoaded":"{f}, {p} pedine yüklendi.","dmNoFile":"Dosya bulunamadı.","dmBadFile":"Bu dosya ses olarak okunamadı.","dmSilent":"Bu dosya sessiz.","dmSaveAsk":"Kitine bir ad ver. Örnekler dosya yolu olarak kaydedilir; dosyaları yerinden taşıma.","dmKitName":"Kit adı","dmKitSaved":"Kit kaydedildi: {f}","dmKitFail":"Kit kaydedilemedi ya da okunamadı.","dmKitLoaded":"{n} kiti yüklendi.","dmKitMissing":"Bazı örnekler bulunamadı ve analog çalıyor: {f}","dmNoKits":"Henüz kayıtlı kit yok","dmFromFile":"Dosyadan...","dmPad_kick":"Kick","dmPad_snare":"Snare","dmPad_clap":"Clap","dmPad_hat":"Hi-hat","dmPad_ohat":"Açık hat","dmPad_rim":"Rim","dmPad_perc":"Perküsyon","dmLevel":"Seviye","dmTune":"Ton","dmDecay":"Sönüm","dmPunch":"Punch","dmSoft":"Soft","dmMid":"Mid","dmHigh":"High","dmLevelHint":"Bu pedin ses seviyesi.","dmTuneHint":"Yarım ses cinsinden perde.","dmDecayHint":"Kuyruğun uzunluğu.","dmPunchHint":"Vuruşun gücü. %50'nin üstünde vuruş sertleşir ve kick süpürmesi derinleşir; altında daha yuvarlak olur.","dmSoftHint":"Vuruşu yumuşatır: daha yavaş atak, daha koyu tını, daha az sürücü ve tık.","dmMidHint":"Gövdeyi artır ya da azalt (kick 350 Hz, snare 900 Hz, hat'ler 3 kHz).","dmHighHint":"Tizleri artır ya da azalt (hava, tık, cızırtı).","pLoud":"Ses yüksekliği -14 LUFS","pLoudHint":"Çıkışı -14 LUFS (yayın seviyesi) civarında tutar, tepe sınırlayıcı -1 dBFS. Kapalı: önceki yumuşak limiter.","asName":"Asistan","asTip":"Tek gözlü asistanın: öneriler için tıkla.","asFooter":"Öneriler eklentinin kendi ayarlarına bakan kurallardan gelir. İnternet ya da bulut kullanılmaz.","asNext":"Sonraki","asClose":"Kapat","asApply":"Uygula","asOk":"Anladım","asCounter":"Öneri {i} / {n}","asDone":"Uygulandı: {t}","as_play_t":"Önce dinle","as_play":"Soldan bir stil seç ve Çal'a bas (Boşluk). DAW çalarken HitGen onun temposunu izler.","as_loud_t":"-14 LUFS'u aç","as_loud":"Ses yüksekliği normalleştirmesi kapalı. Açarsan çıkış -1 dBFS tavanla -14 LUFS civarında kalır.","as_swing_t":"Swing ekle","as_swing":"Afro groove'lar biraz swing ile nefes alır. Swing'i %10 yap.","as_hook_t":"Kısa hook kullan","as_hook":"Bu varyasyon uzun bir melodi yazıyor. Kulüpte kısa ve tekrar eden bir hook genelde daha iyi çalışır. Uygula, kısa motifli bir varyasyona geçer.","as_bars_t":"8 ölçü kullan","as_bars":"4 ölçü kulüp döngüsü için kısa kalabilir. 8 ölçü, hook'a kendine cevap verecek alan bırakır.","as_energy_t":"Enerjiyi artır","as_energy":"Enerji düşük; hat ve kick'ler seyreltiliyor. Kulüp için %65 civarı uygun.","as_pump_t":"Sidechain pompası ekle","as_pump":"Sidechain pompası neredeyse kapalı. House ve techno'da %60–100, bas ve akorları kick ile birlikte hareket ettirir.","as_thick_t":"Daha dolgun","as_thick":"Kalınlık düşük. %70'te akorların altına kök nota eklenir.","as_creative_t":"Kendi kitini kur","as_creative":"Kendi örneklerini yüklemek ve Punch, Soft, Mid, High ayarlarını kullanmak için Yaratıcı modu aç.","as_sample_t":"Bir örnek bırak","as_sample":"Bilgisayarından bir WAV ya da AIFF'i bir pede sürükle. En sevdiğin kick ile başla.","as_ref_t":"Referans yükle","as_ref":"Bir şarkıyı pencereye sürükle. Tempo, ton ve bölgeler otomatik bulunur; sonra DNA'sını çıkar.","as_cpu_t":"İşlemciyi rahatlat","as_cpu":"İşlemci yükü yüksek. Eko performans daha az unison sesi kullanır.","as_drums_t":"Davul makinesini dene","as_drums":"Yeni davul makinesinde analog kick, snare, clap, hat, rim ve perküsyon var. Kendi örneklerini de yükleyebilirsin.","as_drag_t":"MIDI'yi DAW'a sürükle","as_drag":"İz kutularından birini (Akor .mid, Bas .mid...) ya da Döngü ve Tam parça kutularını doğrudan DAW'a sürükle.","as_learn_t":"Kontrolcü eşle","as_learn":"Bir düğmeye sağ tıkla, MIDI Learn'ü seç, sonra kontrolcündeki bir düğmeyi oynat.","as_newidea_t":"Yeni fikir","as_newidea":"Yeni fikir için N'ye bas: tohum, varyasyon, ton, enerji ve tempo stilin içinde birlikte değişir.","gdStart":"Kılavuzu başlat","gdBack":"Geri","gdNext":"İleri","gdDone":"Bitir","gdSkip":"Atla","gdStep":"Adım {i} / {n}","hdHelpTips":"Kısayollar ve ipuçları","gd1_t":"HitGen'e hoş geldin","gd1":"Yaklaşık bir dakikada temel kullanımı öğreneceksin: stil seç, dinle, yeni fikir al, sesleri şekillendir ve MIDI'yi DAW'a sürükle. İleri'ye ya da sağ ok tuşuna bas.","gd2_t":"1. Bir stil seç","gd2":"Her sanatçı ilhamlı stilin kendi temposu, armonisi, groove'u ve sesleri var. Üstten türe göre süz, alttaki dört varyasyonu dene.","gd3_t":"2. Dinle","gd3":"Çal (ya da Boşluk) döngüyü dinletir. DAW çalarken HitGen DAW'ın temposunu kendiliğinden izler.","gd4_t":"3. Yeni fikirler","gd4":"Yeni fikir (N) tohumu, varyasyonu, tonu, enerjiyi ve tempoyu birlikte değiştirir. Tohum kutusuyla beğendiğin fikre geri dönebilirsin.","gd5_t":"4. İzler ve sesler","gd5":"Her izin kendi sesi var; listeden değiştir. ↻ düğmesi yalnızca o izin MIDI'sini yeniden yazar. Piyano rulosu dışa aktarılacak notaları gösterir.","gd6_t":"5. DAW'a sürükle","gd6":"Bir iz kutusunu, Döngü'yü ya da Tam parça'yı doğrudan DAW'a sürükle. Kutunun üstünde Enter'a basarak dosya olarak da kaydedebilirsin.","gd7_t":"6. Davul makinesi","gd7":"Yedi analog ped: kick, snare, clap, hi-hat, açık hat, rim ve perküsyon. Yaratıcı modu aç ve kendi örneklerini pedlere bırakarak kit kur.","gd8_t":"7. Her pedi şekillendir","gd8":"Punch vuruşu sertleştirir, Soft yuvarlar, Mid ve High EQ'dur. Ton ve Sönüm perdeyi ve uzunluğu değiştirir. Sonucu Kiti kaydet ile sakla.","gd9_t":"8. Referans ve DNA","gd9":"Buraya bir şarkı sürükle: tempo, ton ve bölgeler bulunur. DNA bir bölgenin sesini ölçer, Üret benzer bir synth sesi tasarlar. Ses asla kopyalanmaz.","gd10_t":"9. Ses tasarımı","gd10":"Akor, bas ve melodi seslerinin tüm parametreleri: osilatörler, filtre, zarflar, LFO'lar ve efektler. Serum 2 presetlerini de içe aktarabilirsin.","gd11_t":"10. Asistanın","gd11":"Bu tek gözlü karakter, mevcut ayarlarına göre öneriler verir. Sarı nokta yeni bir önerisi olduğunu gösterir. Uygula ayarı senin yerine değiştirir.","gd12_t":"Hazırsın","gd12":"Çıkış -14 LUFS civarında tutulur (Ayarlar). MIDI Learn için düğmeye sağ tıkla. Yardım ya da F1 bu kılavuzu yeniden açar."});
Object.assign(HG.I18N.de, {"navDrums":"Drum Machine","dmTitle":"Drum Machine","dmCreative":"Kreativmodus","dmCreativeHint":"An: dein eigenes Kit spielt (Samples und Pad-Regler). Aus: das analoge Kit des Stils spielt.","dmKit":"Analog-Kit","dmKitHint":"Das analoge Grund-Kit. Pads ohne Sample spielen dieses Kit.","dmSaveKit":"Kit speichern","dmSaveKitHint":"Pad-Einstellungen und Sample-Pfade als .hgkit-Datei speichern.","dmLoadKit":"Kit laden","dmLoadKitHint":"Eines deiner gespeicherten Kits laden.","dmReset":"Pads zurücksetzen","dmResetHint":"Alle Pad-Regler auf Standard, Samples entfernt.","dmResetDone":"Alle Pads zurückgesetzt.","dmHintOn":"Kreativmodus an: Ziehe ein WAV, AIFF, FLAC oder MP3 auf ein Pad oder nutze Laden. Forme jedes Pad mit Punch, Soft, Mid und High. Klicke ein Pad zum Anhören.","dmHintOff":"Das analoge Kit des Stils spielt. Schalte den Kreativmodus ein, um aus Samples ein eigenes Kit zu bauen und die Pad-Regler zu nutzen. Klicke ein Pad zum Anhören.","dmPadHint":"Klicken oder Leertaste zum Anhören. Audiodatei hier ablegen, um sie zu laden (Kreativmodus).","dmLoad":"Sample laden","dmLoadHint":"Wähle eine Audiodatei für dieses Pad (bis 12 Sekunden).","dmClear":"Sample entfernen","dmCleared":"Sample von {p} entfernt; der analoge Klang spielt wieder.","dmAnalog":"Analog","dmDrop":"Zum Laden ablegen","dmLoaded":"{f} auf {p} geladen.","dmNoFile":"Die Datei wurde nicht gefunden.","dmBadFile":"Diese Datei konnte nicht als Audio gelesen werden.","dmSilent":"Diese Datei ist stumm.","dmSaveAsk":"Gib deinem Kit einen Namen. Samples werden als Dateipfade gespeichert, lass die Dateien also an ihrem Ort.","dmKitName":"Kit-Name","dmKitSaved":"Kit gespeichert: {f}","dmKitFail":"Das Kit konnte nicht gespeichert oder gelesen werden.","dmKitLoaded":"Kit {n} geladen.","dmKitMissing":"Einige Samples fehlen und spielen analog: {f}","dmNoKits":"Noch keine gespeicherten Kits","dmFromFile":"Aus Datei...","dmPad_kick":"Kick","dmPad_snare":"Snare","dmPad_clap":"Clap","dmPad_hat":"Hi-Hat","dmPad_ohat":"Offene Hat","dmPad_rim":"Rim","dmPad_perc":"Percussion","dmLevel":"Pegel","dmTune":"Stimmung","dmDecay":"Decay","dmPunch":"Punch","dmSoft":"Soft","dmMid":"Mid","dmHigh":"High","dmLevelHint":"Lautstärke dieses Pads.","dmTuneHint":"Tonhöhe in Halbtönen.","dmDecayHint":"Länge des Ausklangs.","dmPunchHint":"Anschlagstärke. Über 50% härter und mit tieferem Kick-Sweep, darunter runder.","dmSoftHint":"Macht den Schlag weicher: langsamere Attack, dunklerer Klang, weniger Drive und Klick.","dmMidHint":"Körper anheben oder absenken (Kick 350 Hz, Snare 900 Hz, Hats 3 kHz).","dmHighHint":"Höhen anheben oder absenken (Luft, Klick, Zischen).","pLoud":"Lautheit -14 LUFS","pLoudHint":"Hält den Ausgang bei etwa -14 LUFS (Streaming-Pegel) mit -1-dBFS-Limiter. Aus: der frühere weiche Limiter.","asName":"Assistent","asTip":"Dein einäugiger Assistent: klicke für Vorschläge.","asFooter":"Vorschläge entstehen aus Regeln, die die eigenen Einstellungen des Plug-ins lesen. Kein Internet, keine Cloud.","asNext":"Weiter","asClose":"Schließen","asApply":"Anwenden","asOk":"Verstanden","asCounter":"Vorschlag {i} von {n}","asDone":"Angewendet: {t}","as_play_t":"Erst anhören","as_play":"Wähle links einen Stil und drücke Abspielen (Leertaste). Wenn deine DAW spielt, folgt HitGen ihrem Tempo.","as_loud_t":"-14 LUFS einschalten","as_loud":"Die Lautheitsnormalisierung ist aus. Schalte sie ein, damit der Ausgang bei etwa -14 LUFS mit -1 dBFS Obergrenze liegt.","as_swing_t":"Swing hinzufügen","as_swing":"Afro-Grooves atmen mit etwas Swing. Stelle Swing auf 10%.","as_hook_t":"Kurzen Hook nutzen","as_hook":"Diese Variation schreibt eine lange Melodie. Im Club wirkt ein kurzer, wiederholter Hook meist besser. Anwenden wechselt zu einer Variation mit kurzem Motiv.","as_bars_t":"8 Takte nutzen","as_bars":"4 Takte sind für einen Club-Loop oft kurz. 8 Takte geben dem Hook Raum, sich selbst zu antworten.","as_energy_t":"Energie erhöhen","as_energy":"Die Energie ist niedrig, Hats und Kicks werden ausgedünnt. Etwa 65% passt zum Club.","as_pump_t":"Sidechain-Pump hinzufügen","as_pump":"Der Sidechain-Pump ist fast aus. In House und Techno lassen 60–100% Bass und Akkorde mit der Kick atmen.","as_thick_t":"Mehr Gewicht","as_thick":"Die Dichte ist niedrig. Bei 70% kommt ein Grundton unter die Akkorde.","as_creative_t":"Eigenes Kit bauen","as_creative":"Schalte den Kreativmodus ein, um eigene Samples zu laden und Punch, Soft, Mid und High zu nutzen.","as_sample_t":"Sample ablegen","as_sample":"Ziehe ein WAV oder AIFF von deinem Computer auf ein Pad. Beginne mit deiner Lieblings-Kick.","as_ref_t":"Referenz laden","as_ref":"Ziehe einen Song auf das Fenster. Tempo, Tonart und Bereiche werden automatisch erkannt; dann extrahiere seine DNA.","as_cpu_t":"CPU entlasten","as_cpu":"Die CPU-Last ist hoch. Eco nutzt weniger Unison-Stimmen.","as_drums_t":"Drum Machine testen","as_drums":"Die neue Drum Machine hat analoge Kick, Snare, Clap, Hats, Rim und Percussion. Du kannst auch eigene Samples laden.","as_drag_t":"MIDI in die DAW ziehen","as_drag":"Ziehe eine Spur-Kachel (Akkorde .mid, Bass .mid...) oder Loop und Ganzer Track direkt in deine DAW.","as_learn_t":"Controller zuweisen","as_learn":"Rechtsklick auf einen Regler, MIDI Learn wählen, dann einen Regler an deinem Controller bewegen.","as_newidea_t":"Neue Idee","as_newidea":"Drücke N für eine neue Idee: Seed, Variation, Tonart, Energie und Tempo ändern sich gemeinsam innerhalb des Stils.","gdStart":"Anleitung starten","gdBack":"Zurück","gdNext":"Weiter","gdDone":"Fertig","gdSkip":"Überspringen","gdStep":"Schritt {i} von {n}","hdHelpTips":"Tastenkürzel und Tipps","gd1_t":"Willkommen bei HitGen","gd1":"In etwa einer Minute kennst du die Grundlagen: Stil wählen, anhören, neue Ideen holen, Klänge formen und MIDI in die DAW ziehen. Drücke Weiter oder die Pfeiltaste rechts.","gd2_t":"1. Stil wählen","gd2":"Jeder von Künstlern inspirierte Stil hat eigenes Tempo, Harmonik, Groove und Klänge. Filtere oben nach Genre und probiere unten die vier Variationen.","gd3_t":"2. Anhören","gd3":"Abspielen (oder Leertaste) spielt den Loop. Wenn deine DAW läuft, folgt HitGen automatisch ihrem Tempo.","gd4_t":"3. Neue Ideen","gd4":"Neue Idee (N) ändert Seed, Variation, Tonart, Energie und Tempo gemeinsam. Mit dem Seed-Feld kommst du zu einer Idee zurück, die dir gefiel.","gd5_t":"4. Spuren und Klänge","gd5":"Jede Spur hat ihren eigenen Klang; wechsle ihn in der Liste. ↻ schreibt nur das MIDI dieser Spur neu. Die Pianorolle zeigt, was exportiert wird.","gd6_t":"5. In die DAW ziehen","gd6":"Ziehe eine Spur-Kachel, den Loop oder den ganzen Track direkt in deine DAW. Enter auf einer Kachel speichert sie als Datei.","gd7_t":"6. Drum Machine","gd7":"Sieben analoge Pads: Kick, Snare, Clap, Hi-Hat, offene Hat, Rim und Percussion. Schalte den Kreativmodus ein und lege eigene Samples auf die Pads.","gd8_t":"7. Jedes Pad formen","gd8":"Punch macht den Schlag härter, Soft runder, Mid und High sind EQ. Stimmung und Decay ändern Tonhöhe und Länge. Speichere das Ergebnis mit Kit speichern.","gd9_t":"8. Referenz und DNA","gd9":"Ziehe einen Song hierher: Tempo, Tonart und Bereiche werden erkannt. DNA misst den Klang eines Bereichs, Generate entwirft einen ähnlichen Synth-Klang. Das Audio wird nie kopiert.","gd10_t":"9. Sounddesign","gd10":"Alle Parameter der Akkord-, Bass- und Melodieklänge: Oszillatoren, Filter, Hüllkurven, LFOs und Effekte. Auch Serum-2-Presets lassen sich importieren.","gd11_t":"10. Dein Assistent","gd11":"Diese einäugige Figur macht Vorschläge auf Basis deiner aktuellen Einstellungen. Ein gelber Punkt bedeutet etwas Neues. Anwenden ändert die Einstellung für dich.","gd12_t":"Bereit","gd12":"Der Ausgang bleibt bei etwa -14 LUFS (Einstellungen). Rechtsklick auf einen Regler für MIDI Learn. Hilfe oder F1 öffnet diese Anleitung erneut."});
Object.assign(HG.I18N.es, {"navDrums":"Caja de ritmos","dmTitle":"Caja de ritmos","dmCreative":"Modo creativo","dmCreativeHint":"Activado: suena tu propio kit (samples y controles de pad). Desactivado: suena el kit analógico del estilo.","dmKit":"Kit analógico","dmKitHint":"El kit analógico base. Los pads sin sample tocan este kit.","dmSaveKit":"Guardar kit","dmSaveKitHint":"Guarda los ajustes de los pads y las rutas de los samples como archivo .hgkit.","dmLoadKit":"Cargar kit","dmLoadKitHint":"Carga uno de tus kits guardados.","dmReset":"Reiniciar pads","dmResetHint":"Todos los controles de pad vuelven al valor por defecto y se quitan los samples.","dmResetDone":"Todos los pads reiniciados.","dmHintOn":"Modo creativo activado: arrastra un WAV, AIFF, FLAC o MP3 a un pad o usa Cargar. Da forma a cada pad con Punch, Soft, Mid y High. Haz clic en un pad para escucharlo.","dmHintOff":"Suena el kit analógico del estilo. Activa el modo creativo para crear tu propio kit con samples y usar los controles de pad. Haz clic en un pad para escucharlo.","dmPadHint":"Haz clic o pulsa Espacio para escuchar este pad. Suelta aquí un archivo de audio para cargarlo (modo creativo).","dmLoad":"Cargar sample","dmLoadHint":"Elige un archivo de audio para este pad (hasta 12 segundos).","dmClear":"Quitar sample","dmCleared":"Sample quitado de {p}; vuelve a sonar el sonido analógico.","dmAnalog":"Analógico","dmDrop":"Suelta para cargar","dmLoaded":"{f} cargado en {p}.","dmNoFile":"No se encontró el archivo.","dmBadFile":"No se pudo leer este archivo como audio.","dmSilent":"Este archivo está en silencio.","dmSaveAsk":"Ponle nombre a tu kit. Los samples se guardan como rutas de archivo, así que no muevas los archivos.","dmKitName":"Nombre del kit","dmKitSaved":"Kit guardado: {f}","dmKitFail":"No se pudo guardar o leer el kit.","dmKitLoaded":"Kit {n} cargado.","dmKitMissing":"Algunos samples no se encontraron y suenan en analógico: {f}","dmNoKits":"Aún no hay kits guardados","dmFromFile":"Desde archivo...","dmPad_kick":"Bombo","dmPad_snare":"Caja","dmPad_clap":"Palmas","dmPad_hat":"Hi-hat","dmPad_ohat":"Hat abierto","dmPad_rim":"Aro","dmPad_perc":"Percusión","dmLevel":"Nivel","dmTune":"Afinación","dmDecay":"Caída","dmPunch":"Punch","dmSoft":"Soft","dmMid":"Mid","dmHigh":"High","dmLevelHint":"Volumen de este pad.","dmTuneHint":"Tono en semitonos.","dmDecayHint":"Duración de la cola.","dmPunchHint":"Fuerza del golpe. Por encima del 50% el golpe es más duro y el barrido del bombo más profundo; por debajo, más redondo.","dmSoftHint":"Suaviza el golpe: ataque más lento, timbre más oscuro, menos saturación y clic.","dmMidHint":"Sube o baja el cuerpo (bombo 350 Hz, caja 900 Hz, hats 3 kHz).","dmHighHint":"Sube o baja los agudos (aire, clic, brillo).","pLoud":"Sonoridad -14 LUFS","pLoudHint":"Mantiene la salida cerca de -14 LUFS (nivel de streaming) con limitador de picos a -1 dBFS. Desactivado: el limitador suave anterior.","asName":"Asistente","asTip":"Tu asistente de un solo ojo: haz clic para ver sugerencias.","asFooter":"Las sugerencias salen de reglas que leen los ajustes del propio plugin. Sin internet ni nube.","asNext":"Siguiente","asClose":"Cerrar","asApply":"Aplicar","asOk":"Entendido","asCounter":"Sugerencia {i} de {n}","asDone":"Aplicado: {t}","as_play_t":"Escucha primero","as_play":"Elige un estilo a la izquierda y pulsa Reproducir (Espacio). Cuando tu DAW suena, HitGen sigue su tempo.","as_loud_t":"Activa -14 LUFS","as_loud":"La normalización de sonoridad está desactivada. Actívala para que la salida quede cerca de -14 LUFS con techo de -1 dBFS.","as_swing_t":"Añade swing","as_swing":"Los grooves afro respiran con un poco de swing. Pon el swing al 10%.","as_hook_t":"Usa un gancho corto","as_hook":"Esta variación escribe una melodía larga. En el club suele funcionar mejor un gancho corto y repetido. Aplicar cambia a una variación con motivo corto.","as_bars_t":"Usa 8 compases","as_bars":"4 compases pueden quedarse cortos para un loop de club. 8 compases dan espacio al gancho para responderse.","as_energy_t":"Sube la energía","as_energy":"La energía es baja, así que hats y bombos se aligeran. Alrededor del 65% va bien para el club.","as_pump_t":"Añade bombeo sidechain","as_pump":"El bombeo sidechain está casi apagado. En house y techno, 60–100% hace que bajo y acordes se muevan con el bombo.","as_thick_t":"Más peso","as_thick":"El grosor es bajo. Al 70% se añade una nota raíz bajo los acordes.","as_creative_t":"Crea tu propio kit","as_creative":"Activa el modo creativo para cargar tus samples y usar Punch, Soft, Mid y High.","as_sample_t":"Suelta un sample","as_sample":"Arrastra un WAV o AIFF de tu ordenador a un pad. Empieza con tu bombo favorito.","as_ref_t":"Carga una referencia","as_ref":"Arrastra una canción a la ventana. Tempo, tonalidad y regiones se detectan solos; luego extrae su ADN.","as_cpu_t":"Alivia la CPU","as_cpu":"La carga de CPU es alta. El rendimiento Eco usa menos voces de unísono.","as_drums_t":"Prueba la caja de ritmos","as_drums":"La nueva caja de ritmos tiene bombo, caja, palmas, hats, aro y percusión analógicos. También puedes cargar tus samples.","as_drag_t":"Arrastra el MIDI a tu DAW","as_drag":"Arrastra cualquier pista (Acordes .mid, Bajo .mid...) o los recuadros Loop y Tema completo directamente a tu DAW.","as_learn_t":"Asigna un controlador","as_learn":"Haz clic derecho en un mando, elige MIDI Learn y mueve un mando de tu controlador.","as_newidea_t":"Nueva idea","as_newidea":"Pulsa N para una nueva idea: semilla, variación, tonalidad, energía y tempo cambian juntos dentro del estilo.","gdStart":"Iniciar la guía","gdBack":"Atrás","gdNext":"Siguiente","gdDone":"Terminar","gdSkip":"Omitir","gdStep":"Paso {i} de {n}","hdHelpTips":"Atajos y consejos","gd1_t":"Bienvenido a HitGen","gd1":"En un minuto conocerás lo básico: elegir un estilo, escuchar, sacar ideas nuevas, dar forma a los sonidos y arrastrar MIDI a tu DAW. Pulsa Siguiente o la flecha derecha.","gd2_t":"1. Elige un estilo","gd2":"Cada estilo inspirado en un artista tiene su propio tempo, armonía, groove y sonidos. Filtra por género arriba y prueba las cuatro variaciones de abajo.","gd3_t":"2. Escucha","gd3":"Reproducir (o Espacio) suena el loop. Cuando tu DAW está sonando, HitGen sigue su tempo automáticamente.","gd4_t":"3. Ideas nuevas","gd4":"Nueva idea (N) cambia a la vez la semilla, la variación, la tonalidad, la energía y el tempo. Con la casilla de semilla vuelves a una idea que te gustó.","gd5_t":"4. Pistas y sonidos","gd5":"Cada pista tiene su sonido; cámbialo en la lista. El botón ↻ reescribe solo el MIDI de esa pista. El piano roll muestra lo que se exportará.","gd6_t":"5. Arrastra a tu DAW","gd6":"Arrastra una pista, el Loop o el Tema completo directamente a tu DAW. Pulsa Enter sobre un recuadro para guardarlo como archivo.","gd7_t":"6. Caja de ritmos","gd7":"Siete pads analógicos: bombo, caja, palmas, hi-hat, hat abierto, aro y percusión. Activa el modo creativo y suelta tus samples en los pads para crear un kit.","gd8_t":"7. Da forma a cada pad","gd8":"Punch endurece el golpe, Soft lo redondea, Mid y High son ecualización. Afinación y Caída cambian el tono y la duración. Guarda el resultado con Guardar kit.","gd9_t":"8. Referencia y ADN","gd9":"Arrastra una canción aquí: se detectan tempo, tonalidad y regiones. El ADN mide el sonido de una región y Generar diseña un sonido de sintetizador parecido. El audio nunca se copia.","gd10_t":"9. Diseño sonoro","gd10":"Todos los parámetros de los sonidos de acordes, bajo y melodía: osciladores, filtro, envolventes, LFO y efectos. También puedes importar presets de Serum 2.","gd11_t":"10. Tu asistente","gd11":"Este personaje de un solo ojo da sugerencias según tus ajustes actuales. Un punto amarillo indica que tiene algo nuevo. Aplicar cambia el ajuste por ti.","gd12_t":"Listo","gd12":"La salida se mantiene cerca de -14 LUFS (Ajustes). Clic derecho en un mando para MIDI Learn. Ayuda o F1 vuelve a abrir esta guía."});

:"Mid","dmHigh":"High","dmLevelHint":"مستوى صوت هذه الوسادة.","dmTuneHint":"الطبقة بأنصاف النغمات.","dmDecayHint":"طول الذيل.","dmPunchHint":"قوة الضربة. فوق 50% تصبح الضربة أقسى ويتعمق انزلاق الكيك؛ وتحتها تصبح أنعم.","dmSoftHint":"يليّن الضربة: هجوم أبطأ، نغمة أدفأ، تشبع ونقرة أقل.","dmMidHint":"ارفع أو اخفض الجسم (كيك 350 هرتز، سنير 900 هرتز، هات 3 كيلوهرتز).","dmHighHint":"ارفع أو اخفض الترددات العالية (الهواء والنقرة واللمعان).","pLoud":"علو الصوت -14 LUFS","pLoudHint":"يُبقي الخرج قرب -14 LUFS (مستوى البث) مع محدد ذروة عند -1 dBFS. معطّل: المحدد الناعم السابق.","asName":"المساعد","asTip":"مساعدك ذو العين الواحدة: انقر لتحصل على اقتراحات.","asFooter":"تأتي الاقتراحات من قواعد تقرأ إعدادات الإضافة نفسها. بلا إنترنت ولا سحابة.","asNext":"التالي","asClose":"إغلاق","asApply":"تطبيق","asOk":"فهمت","asCounter":"اقتراح {i} من {n}","asDone":"طُبّق: {t}","as_play_t":"استمع أولاً","as_play":"اختر أسلوباً من اليسار واضغط تشغيل (المسافة). عندما يعزف برنامج DAW يتبع HitGen إيقاعه.","as_loud_t":"فعّل -14 LUFS","as_loud":"تسوية علو الصوت معطّلة. فعّلها ليبقى الخرج قرب -14 LUFS بسقف -1 dBFS.","as_swing_t":"أضف سوينغ","as_swing":"إيقاعات الأفرو تتنفس بقليل من السوينغ. اضبط السوينغ على 10%.","as_hook_t":"استخدم خطّافاً قصيراً","as_hook":"يكتب هذا التنويع لحناً طويلاً. في النادي ينجح عادةً خطّاف قصير متكرر. «تطبيق» ينتقل إلى تنويع بموتيف قصير.","as_bars_t":"استخدم 8 مقاييس","as_bars":"4 مقاييس قد تكون قصيرة لحلقة نادٍ. 8 مقاييس تمنح الخطّاف مساحة ليجيب نفسه.","as_energy_t":"ارفع الطاقة","as_energy":"الطاقة منخفضة فتقلّ الهاي هات والكيك. نحو 65% يناسب النادي.","as_pump_t":"أضف ضخ السايدتشين","as_pump":"ضخ السايدتشين شبه مطفأ. في الهاوس والتكنو تجعل قيمة 60–100% الباص والأكوردات تتحرك مع الكيك.","as_thick_t":"وزن أكبر","as_thick":"الكثافة منخفضة. عند 70% تُضاف نغمة جذر تحت الأكوردات.","as_creative_t":"ابنِ مجموعتك","as_creative":"فعّل الوضع الإبداعي لتحميل عيناتك واستخدام Punch وSoft وMid وHigh.","as_sample_t":"أفلت عينة","as_sample":"اسحب ملف WAV أو AIFF من حاسوبك إلى وسادة. ابدأ بالكيك المفضل لديك.","as_ref_t":"حمّل مرجعاً","as_ref":"اسحب أغنية إلى النافذة. يُكتشف الإيقاع والمقام والمناطق تلقائياً؛ ثم استخرج حمضها النووي.","as_cpu_t":"خفّف عن المعالج","as_cpu":"حمل المعالج مرتفع. أداء «اقتصادي» يستخدم أصوات يونيسون أقل.","as_drums_t":"جرّب آلة الإيقاع","as_drums":"تضم آلة الإيقاع الجديدة كيك وسنير وتصفيق وهات وريم وإيقاعيات تناظرية. ويمكنك تحميل عيناتك أيضاً.","as_drag_t":"اسحب MIDI إلى DAW","as_drag":"اسحب أي مربع مسار (أكوردات .mid، باص .mid...) أو مربعي الحلقة والمقطوعة الكاملة مباشرة إلى DAW.","as_learn_t":"اربط وحدة تحكم","as_learn":"انقر بزر الفأرة الأيمن على أي مقبض واختر «تعلّم MIDI»، ثم حرّك مقبضاً في وحدة التحكم.","as_newidea_t":"فكرة جديدة","as_newidea":"اضغط N لفكرة جديدة: تتغير البذرة والتنويع والمقام والطاقة والإيقاع معاً ضمن الأسلوب.","gdStart":"ابدأ الدليل","gdBack":"رجوع","gdNext":"التالي","gdDone":"إنهاء","gdSkip":"تخطٍّ","gdStep":"الخطوة {i} من {n}","hdHelpTips":"اختصارات ونصائح","gd1_t":"مرحباً بك في HitGen","gd1":"خلال دقيقة تقريباً ستعرف الأساسيات: اختر أسلوباً، استمع، احصل على أفكار جديدة، شكّل الأصوات واسحب MIDI إلى DAW. اضغط «التالي» أو مفتاح السهم.","gd2_t":"1. اختر أسلوباً","gd2":"لكل أسلوب مستوحى من فنان إيقاعه وتناغمه وأصواته. صفِّ حسب النوع في الأعلى وجرّب التنويعات الأربعة في الأسفل.","gd3_t":"2. استمع","gd3":"التشغيل (أو المسافة) يُسمعك الحلقة. عندما يعزف DAW يتبع HitGen إيقاعه تلقائياً.","gd4_t":"3. أفكار جديدة","gd4":"«فكرة جديدة» (N) تغيّر البذرة والتنويع والمقام والطاقة والإيقاع معاً. خانة البذرة تعيدك إلى فكرة أعجبتك.","gd5_t":"4. المسارات والأصوات","gd5":"لكل مسار صوته؛ غيّره من القائمة. زر ↻ يعيد كتابة MIDI هذا المسار فقط. يعرض البيانو رول ما سيُصدَّر.","gd6_t":"5. اسحب إلى DAW","gd6":"اسحب مربع مسار أو الحلقة أو المقطوعة الكاملة مباشرة إلى DAW. اضغط Enter على مربع لحفظه كملف.","gd7_t":"6. آلة الإيقاع","gd7":"سبع وسادات تناظرية: كيك، سنير، تصفيق، هاي هات، هات مفتوح، ريم وإيقاعيات. فعّل الوضع الإبداعي وأفلت عيناتك على الوسادات لتبني مجموعة.","gd8_t":"7. شكّل كل وسادة","gd8":"Punch يقسّي الضربة، وSoft يليّنها، وMid وHigh معادلة صوت. الطبقة والخفوت يغيّران الحدة والطول. احفظ النتيجة بـ «حفظ المجموعة».","gd9_t":"8. المرجع والحمض النووي","gd9":"اسحب أغنية إلى هنا: يُكتشف الإيقاع والمقام والمناطق. يقيس الحمض النووي صوت منطقة، ويصمم «توليد» صوت سينث مشابهاً. لا يُنسخ الصوت أبداً.","gd10_t":"9. تصميم الصوت","gd10":"كل معاملات أصوات الأكوردات والباص واللحن: المذبذبات والمرشح والأغلفة وLFO والمؤثرات. ويمكنك استيراد إعدادات Serum 2 أيضاً.","gd11_t":"10. مساعدك","gd11":"تقدّم هذه الشخصية ذات العين الواحدة اقتراحات بحسب إعداداتك الحالية. النقطة الصفراء تعني أن لديها جديداً. «تطبيق» يغيّر الإعداد عنك.","gd12_t":"جاهز","gd12":"يبقى الخرج قرب -14 LUFS (الإعدادات). انقر مقبضاً بالزر الأيمن لتعلّم MIDI. «مساعدة» أو F1 يفتح هذا الدليل مجدداً."});

      el.innerHTML = '<div><b></b><br><span></span></div><div class="bb"></div>';
      el.querySelector('b').textContent = nm; el.querySelector('span').textContent = T('cat_' + i.cat) + (i.sig ? ' · ' + T('sigTag') : '');
      const bb = el.querySelector('.bb');
      i.roles.forEach(r => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm' + (snd[r] === i.id ? ' on' : ''); b.textContent = '▸ ' + T(r); b.title = T('assign', { r: T(r) }); b.setAttribute('aria-label', nm + ': ' + T('assign', { r: T(r) })); b.setAttribute('aria-pressed', snd[r] === i.id);
        b.addEventListener('click', () => { UI.assign(r, i.id, true); UI.audition(r); renderBank(); }); bb.appendChild(b);
      });
      if (i.cat !== 'Davul') {
        const e = document.createElement('button'); e.type = 'button'; e.className = 'btn sm'; e.textContent = T('design'); e.title = T('openDesign'); e.setAttribute('aria-label', nm + ': ' + T('openDesign'));
        e.addEventListener('click', () => { const r = i.roles[0]; UI.assign(r, i.id, true); UI.editTrack(r); UI.tab('sound'); }); bb.appendChild(e);
      }
      frag.appendChild(el);
    });
    host.appendChild(frag);
  }

  // ---------- Dışa aktarma
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  function baseName() { const P = res().P; return 'HitGen_' + slug(res().style.artist) + '_' + MB.NOTES[P.key].replace('#', 's') + '_' + P.scale + '_' + P.bpm + 'bpm_v' + (st.vi + 1) + '_seed' + P.seed; }
  function readme(extra) {
    const r = res(), P = r.P, ki = MB.keyInfo(P.key, P.scale), S = r.style, tx = HG.stxt(S.id), V = tx.vars[st.vi] || tx.vars[0], sn = id => HG.soundName(id, HG.lang);
    const pad = (k) => (T(k) + '               ').slice(0, 15) + ': ';
    return ['WAVEJACKERS HITGEN', '==================', '',
      pad('rmStyle') + T('rmInspired', { a: S.artist, t: tx.tag, v: V.n }),
      pad('rmKey') + MB.NOTES[P.key] + ' ' + T('scale_' + P.scale), pad('rmScaleNotes') + ki.notes.join(' '), pad('rmCamelot') + ki.cam + '  (' + T('rmCompat') + ': ' + ki.compat.join(', ') + ')',
      pad('rmTempo') + T('rmTempoV', { bpm: P.bpm, bars: P.bars, seed: P.seed }),
      pad('rmChords') + r.chords.map(c => c.name).join(' | '), pad('rmRoman') + r.chords.map(c => c.roman).join(' | '),
      pad('rmSound') + T('chords') + ' ' + sn(snd.chords) + ', ' + T('bass') + ' ' + sn(snd.bass) + ', ' + T('melody') + ' ' + sn(snd.melody) + ', ' + T('drums') + ' ' + sn(snd.drums), '  ' + T('rmNoAudio'), '',
      T('rmFiles'), '  *_chords.mid / _bass.mid / _drums.mid / _melody.mid : ' + T('rmF1'), '  *_tum-izler_format1.mid : ' + T('rmF2'), '  *_tek-iz_format0.mid    : ' + T('rmF3'), '  *_tam-parca.mid         : ' + T('rmF4'), '',
      T('rmDrum'), '  Kick 36 (C1), Rim 37, Snare 38, Clap 39, Closed Hat 42, Open Hat 46, Perc 64', '',
      T('rmNote'), T('rmFree')].concat(extra ? ['', extra] : []).join('\r\n');
  }
  const utf = s => new TextEncoder().encode('﻿' + s);
  const readmeFile = extra => ({ name: T('readme'), data: utf(readme(extra)) });
  async function save(name, bytes, ok) {
    const dl = UI.dl; if (!dl) { toast(T('dlOff')); return; }
    try { await dl.save({ filename: name, data: new Blob([bytes], { type: 'application/zip' }) }); toast(T('saved', { f: name }) + (ok == null ? T('zipMid') : ok)); }
    catch (e) { toast(e && e.code === 'declined' ? T('declined') : T('dlFail', { c: (e && e.code) || '?' })); }
  }
  async function dlLoop() {
    const base = baseName(), files = KEYS.map(k => ({ name: base + '_' + k + '.mid', data: MB.midiFile(res(), [k]) }));
    files.push({ name: base + '_tum-izler_format1.mid', data: MB.midiFile(res(), KEYS) }, { name: base + '_tek-iz_format0.mid', data: MB.midiFile(res(), KEYS, true) }, readmeFile());
    await save(base + '_midi.zip', MB.zip(files));
  }
  async function dlSong() {
    const base = baseName(), a = HG.assemble(res()), files = [{ name: base + '_tam-parca.mid', data: MB.midiFile(a, KEYS) }];
    KEYS.forEach(k => files.push({ name: base + '_tam-' + k + '.mid', data: MB.midiFile(a, [k]) }));
    files.push(readmeFile(T('rmFull') + ': ' + a.sections.map(s => s.name + ' ' + s.bars).join(', ') + ' (' + a.bars + ')'));
    await save(base + '_tam-parca.zip', MB.zip(files));
  }
  async function render(mutedMap) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) throw new Error('no');
    const r = res(), sr = 44100, secs = r.bars * 240 / r.P.bpm + 3, oc = new OAC(2, Math.ceil(sr * secs), sr);
    oc.__q = 'high';                                               // dışa aktarımda her zaman tam kalite
    const mx = MB.mix(oc, oc.destination, r, snd, { muted: mutedMap || {}, patches, pump: r.style.pump, pumpAmt: st.pump / 100, thick: st.thick / 100, quality: 'high' });
    mx.schedule(0.02, {}); return MB.wav(await oc.startRendering());
  }
  let busy = false;
  async function dlWav() {
    if (busy) return; busy = true; toast(T('wavPrep')); const base = baseName();
    try { const wav = await render(); await save(base + '_wav.zip', MB.zip([{ name: base + '_onizleme.wav', data: wav }, readmeFile()]), T('zipWav')); } catch (e) { toast(T('wavFail')); }
    busy = false;
  }
  async function dlStems() {
    if (busy) return; busy = true; const base = baseName(), files = [];
    try {
      for (let i = 0; i < KEYS.length; i++) {
        toast(T('stemPrep', { t: T(KEYS[i]), i: i + 1 })); const m = {}; KEYS.forEach(k => { if (k !== KEYS[i]) m[k] = true; });
        files.push({ name: base + '_' + KEYS[i] + '.wav', data: await render(m) });
      }
      files.push(readmeFile()); await save(base + '_izler-wav.zip', MB.zip(files), T('zipStems'));
    } catch (e) { toast(T('stemFail')); }
    busy = false;
  }
  UI.onDl = function () { ['dl-loop', 'dl-song', 'dl-wav', 'dl-stems'].forEach(id => { $(id).disabled = !UI.dl; }); if (!UI.dl) toast(T('dlOff')); };

  // ---------- Sürükle-bırak (.mid); klavyeyle Enter zip indirir
  const toB64 = b => { let s = ''; for (let i = 0; i < b.length; i += 4096) s += String.fromCharCode.apply(null, b.subarray(i, i + 4096)); return btoa(s); };
  document.addEventListener('dragstart', e => {
    const el = e.target && e.target.closest ? e.target.closest('[data-drag]') : null; if (!el || !res()) return;
    const k = el.dataset.drag, keys = k === 'all' ? KEYS : [k], name = baseName() + '_' + (k === 'all' ? 'tum-izler' : k) + '.mid', bytes = MB.midiFile(res(), keys);
    try { e.dataTransfer.items.add(new File([bytes], name, { type: 'audio/midi' })); } catch (x) {}
    try { e.dataTransfer.setData('DownloadURL', 'audio/midi:' + name + ':data:audio/midi;base64,' + toB64(bytes)); } catch (x) {}
    e.dataTransfer.effectAllowed = 'copy'; toast(T('dragging', { f: name }));
  });
  document.addEventListener('keydown', e => {
    const el = e.target && e.target.closest ? e.target.closest('[data-drag]') : null;
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); dlLoop(); }
  });

  // ---------- Aranjman
  const mmss = s => Math.floor(s / 60) + ':' + ('0' + Math.round(s % 60)).slice(-2);
  const secColor = n => /intro|outro/i.test(n) ? 'var(--grid2)' : /break/i.test(n) ? 'var(--c-chords)' : /build|verse/i.test(n) ? 'var(--c-melody)' : /drop|peak|groove|hook|main/i.test(n) ? 'var(--c-drums)' : 'var(--c-bass)';
  function renderArr() {
    const r = res(), S = r.style, tot = S.arr.reduce((s, x) => s + x[1], 0), bs = 240 / r.P.bpm; let at = 0;
    const arr = $('arr'), mx = $('mx'); arr.innerHTML = ''; mx.innerHTML = '<span></span>' + KEYS.map(k => '<span style="color:var(--c-' + k + ')"></span>').join('');
    mx.querySelectorAll('span').forEach((e, i) => { if (i) e.textContent = T(KEYS[i - 1]); });
    const rtl = document.documentElement.dir === 'rtl';
    S.arr.forEach(([n, b]) => {
      const row = document.createElement('div'); row.className = 'ar';
      row.innerHTML = '<span></span><div class="tl" aria-hidden="true"><i></i></div><span class="t" dir="ltr"></span>';
      row.children[0].textContent = n; const i = row.querySelector('i'); i.style[rtl ? 'right' : 'left'] = (at / tot * 100) + '%'; i.style.width = (b / tot * 100) + '%'; i.style.setProperty('--sc', secColor(n));
      row.children[2].textContent = T('bar') + ' ' + (at + 1) + '–' + (at + b) + ' · ' + mmss(at * bs);
      arr.appendChild(row);
      const m = HG.maskFor(n, Math.floor(b / 2), b);
      const lab = document.createElement('span'); lab.textContent = n; mx.appendChild(lab);
      KEYS.forEach(k => { const c = document.createElement('i'); if (k === 'drums' ? m.drums !== 'none' : m[k]) c.className = 'on'; c.style.setProperty('--tc', 'var(--c-' + k + ')'); mx.appendChild(c); });
      at += b;
    });
    const p = document.createElement('p'); p.className = 'fine'; p.textContent = T('arrTotal', { b: tot, t: mmss(tot * bs), bpm: r.P.bpm }); arr.appendChild(p);
  }
  const DAWS = [['FL Studio', 'daw_fl'], ['Ableton Live', 'daw_ab'], ['Logic Pro', 'daw_lo'], ['Cubase', 'daw_cu'], ['Reaper', 'daw_re'], ['Bitwig', 'daw_bi'], ['Studio One', 'daw_so'], ['GarageBand', 'daw_ga']];
  function renderDaws() { const h = $('daws'); h.innerHTML = ''; DAWS.forEach(([n, k]) => { const d = document.createElement('div'); d.className = 'daw'; d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = n; d.lastChild.textContent = T(k); h.appendChild(d); }); }
  UI.onLang2 = function () { renderDaws(); if (!$('p-bank').hidden) { buildBankBar(); renderBank(); } if (!$('p-export').hidden) renderArr(); };

  // ---------- Başlat
  $('dl-loop').addEventListener('click', dlLoop); $('dl-song').addEventListener('click', dlSong); $('dl-wav').addEventListener('click', dlWav); $('dl-stems').addEventListener('click', dlStems);
  UI.init1(); renderDaws(); UI.init2();
  UI.test = { baseName, readme, render, renderBank };
})();
</script>
