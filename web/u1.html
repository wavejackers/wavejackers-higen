<title>Wavejackers HitGen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&family=Unbounded:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#2fd6c6}
:root{
  --bg:#090b0e;--panel:#11151a;--panel2:#171c23;--ink:#eaf0f5;--mute:#8a96a4;--line:#242c37;--line2:#323c49;
  --accent:#2fd6c6;--accent-ink:#04100f;--focus:#9db4ff;
  --c-chords:#8f9bff;--c-bass:#3fd9b8;--c-drums:#ff72a4;--c-melody:#f5c04b;
  --roll:#0d1115;--grid:#1a2129;--grid2:#2a3440;
  --f-d:'Unbounded','Noto Sans Arabic','Noto Sans Devanagari','Arial Black',system-ui,sans-serif;--f-b:'Instrument Sans','Noto Sans Arabic','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;--f-m:'Martian Mono','Noto Sans Arabic','Noto Sans Devanagari',ui-monospace,Menlo,Consolas,monospace;--fs:1;
  --beat:.476s;color-scheme:dark;transition:--accent .7s ease;
}
:root[data-theme="light"]{
  --bg:#e8ecf0;--panel:#f7f9fb;--panel2:#edf1f5;--ink:#10161c;--mute:#566271;--line:#cdd5de;--line2:#b4bfcb;
  --accent-ink:#ffffff;--focus:#2d4bd6;
  --c-chords:#4558e8;--c-bass:#0b8f77;--c-drums:#d0295f;--c-melody:#b07a00;
  --roll:#eef2f6;--grid:#dde3ea;--grid2:#c3ccd7;color-scheme:light;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e8ecf0;--panel:#f7f9fb;--panel2:#edf1f5;--ink:#10161c;--mute:#566271;--line:#cdd5de;--line2:#b4bfcb;
  --accent-ink:#ffffff;--focus:#2d4bd6;
  --c-chords:#4558e8;--c-bass:#0b8f77;--c-drums:#d0295f;--c-melody:#b07a00;
  --roll:#eef2f6;--grid:#dde3ea;--grid2:#c3ccd7;color-scheme:light;}}
*{box-sizing:border-box}
html{background:var(--bg);font-size:calc(100% * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/1.5 var(--f-b);padding:18px 16px 56px}
.skip{position:absolute;left:12px;top:-60px;z-index:9;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:10px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.prefs{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;width:100%;justify-content:flex-end}
.pref{display:flex;flex-direction:column;gap:3px}
.pref select{padding:5px 8px;font-size:.78rem}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.rk{font:500 .62rem var(--f-m);color:var(--sa);margin-top:2px}
main:focus{outline:none}
:root[dir=rtl] .sty::after{left:auto;right:0}
:root[dir=rtl] .ar .t{text-align:left}
@media (forced-colors: active){.btn,.sty,.node,.card,.trk,.mod,.bc{border:1px solid CanvasText}.kn .vl{stroke:Highlight}.btn.on,.sty[aria-pressed=true]{outline:2px solid Highlight}.cables{display:none}}
button,select,input{font:inherit;color:inherit}
.app{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* üst çubuk */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{font:800 clamp(1.25rem,3.4vw,1.9rem)/1 var(--f-d);margin:0;letter-spacing:-.01em}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand span{font:400 .7rem var(--f-m);color:var(--mute)}
.tport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.play{min-width:108px;display:flex;align-items:center;justify-content:center;gap:8px}
.play svg{width:14px;height:14px;fill:currentColor}
.chipnum{font:500 .85rem var(--f-m);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;display:flex;gap:6px;align-items:baseline}
.chipnum small{color:var(--mute);font-size:.66rem}
.chipnum input{width:5.2ch;background:none;border:0;padding:0;font:inherit;text-align:right}
.chipnum input:focus-visible{outline-offset:4px;border-radius:3px}
/* kablo şeridi */
.path{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px 18px 16px;overflow:hidden}
.path::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 0% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);pointer-events:none}
.nodes{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,5vw,68px)}
.node{position:relative;z-index:1;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:border-color .2s,transform .2s}
.node:hover{border-color:var(--accent)}
.node b{font:700 .78rem var(--f-d)}
.node small{font:400 .68rem var(--f-m);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--tc);opacity:.35}
.node.hit .dot{animation:blink .22s ease-out}
.node.hit{border-color:var(--tc)}
.node .jk{position:absolute;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.node .jk.l{left:-6px}.node .jk.r{right:-6px}
.node:first-child .jk.l,.node:last-child .jk.r{display:none}
@media (max-width:640px){.nodes{grid-template-columns:1fr 1fr;gap:30px 36px}.node .jk{display:none}}
@keyframes blink{0%{opacity:1;box-shadow:0 0 0 0 var(--tc)}100%{opacity:.35;box-shadow:0 0 0 9px transparent}}
.cables{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.cables path{fill:none;stroke-linecap:round}
.cables .c1{stroke:var(--line2);stroke-width:5}
.cables .c2{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 12;animation:flow var(--beat) linear infinite;animation-play-state:paused}
body.playing .cables .c2{animation-play-state:running}
@keyframes flow{to{stroke-dashoffset:-15}}
.strip{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.strip canvas{flex:1;min-width:140px;height:34px;display:block}
.strip .st{font:400 .7rem var(--f-m);color:var(--mute)}
/* sekmeler */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font:600 .92rem var(--f-b);color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.pane[hidden]{display:none}
.pane{display:flex;flex-direction:column;gap:16px}
/* stil duvarı */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.sty{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;transition:border-color .2s,transform .2s}
.sty::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sa)}
.sty b{font:700 .86rem/1.2 var(--f-d)}
.sty span{font:400 .7rem var(--f-m);color:var(--mute)}
.sty:hover{transform:translateY(-2px);border-color:var(--sa)}
.sty[aria-pressed="true"]{border-color:var(--sa);background:color-mix(in srgb,var(--sa) 10%,var(--panel))}
.sty small{font-size:.74rem;color:var(--mute);line-height:1.35;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:700 .95rem var(--f-d);margin:0}
.card p{margin:0;color:var(--mute);font-size:.88rem;max-width:72ch}
.card p b{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lab{font:400 .72rem var(--f-m);color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.lab em{font-style:normal;color:var(--ink)}
select,.txt{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:500 .86rem var(--f-m)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.vars .btn{flex:1 1 auto;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 12px;min-width:110px}
.vars .btn small{font:400 .66rem/1.3 var(--f-m);color:var(--mute);font-weight:400}
.vars .btn.on small{color:var(--ink)}
.checkrow{display:flex;align-items:center;gap:8px;font-size:.88rem}
.checkrow input{accent-color:var(--accent);width:16px;height:16px}
.prog{display:flex;flex-wrap:wrap;gap:8px}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:76px;transition:border-color .1s,background .1s}
.pc b{font:700 1.05rem var(--f-d);display:block}
.pc span{font:400 .66rem var(--f-m);color:var(--mute)}
.pc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.meta{font:400 .74rem var(--f-m);color:var(--mute)}
/* izler */
.trk{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap}
.th i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.th b{font:700 .84rem var(--f-d)}
.th .inf{font:400 .68rem var(--f-m);color:var(--mute);flex:1;min-width:120px}
.sr{display:flex;gap:8px;padding:0 12px 9px;align-items:center}
.sr select{padding:5px 8px;font-size:.78rem}
.wrap{position:relative}
.roll{display:block;width:100%;background:var(--roll);border-top:1px solid var(--line)}
.ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--accent);display:none;pointer-events:none;box-shadow:0 0 12px var(--accent)}
.drag{font:400 .72rem var(--f-m);border:1px dashed var(--line2);border-radius:8px;padding:5px 9px;cursor:grab;user-select:none;background:var(--panel2)}
.drag:hover{border-color:var(--accent)}
.drag.big{display:block;text-align:center;padding:14px;font-size:.8rem}
/* ses tasarımı */
.synth{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.mod{grid-column:span 4;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod.w6{grid-column:span 6}.mod.w8{grid-column:span 8}.mod.w12{grid-column:span 12}
@media (max-width:980px){.mod,.mod.w6,.mod.w8{grid-column:span 6}}
@media (max-width:640px){.mod,.mod.w6,.mod.w8{grid-column:span 12}}
.mod h3{font:700 .78rem var(--f-d);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:8px 4px}
.kn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;touch-action:none;user-select:none}
.kn .k{width:50px;height:50px;position:relative;cursor:ns-resize;border-radius:50%}
.kn svg{width:100%;height:100%;display:block}
.kn .tr{stroke:var(--line2);fill:none;stroke-width:4;stroke-linecap:round}
.kn .vl{stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round}
.kn .nd{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.kn label{font:400 .66rem var(--f-m);color:var(--mute);text-align:center;cursor:default}
.kn output{font:500 .68rem var(--f-m);color:var(--ink)}
.oscrow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.cv{display:block;width:100%;border-radius:10px;background:var(--roll);border:1px solid var(--line)}
.tg{display:flex;gap:5px;flex-wrap:wrap}
.tg .btn{padding:4px 9px;font-size:.76rem;border-radius:7px}
.kbd{position:relative;height:96px;user-select:none;touch-action:none}
.kbd .wk{position:absolute;top:0;bottom:0;background:#f1f4f7;border:1px solid #98a3af;border-radius:0 0 6px 6px;cursor:pointer}
.kbd .bk{position:absolute;top:0;height:60%;background:#12171c;border:1px solid #000;border-radius:0 0 4px 4px;cursor:pointer;z-index:2}
.kbd .wk.dn{background:var(--accent)}.kbd .bk.dn{background:var(--accent)}
.kbd small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:400 .56rem var(--f-m);color:#59636e;pointer-events:none}
.sel3{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* banka */
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.bc{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:9px 11px;display:flex;flex-direction:column;gap:7px;justify-content:space-between;min-width:0}
.bc b{font-size:.9rem;font-weight:600;overflow-wrap:anywhere}
.bc span{font:400 .64rem var(--f-m);color:var(--mute)}
.bc .bb{display:flex;gap:5px;flex-wrap:wrap}
.bc.sig{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
/* aranjman */
.arr{display:grid;gap:6px}
.ar{display:grid;grid-template-columns:minmax(70px,104px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.ar .tl{height:12px;background:var(--grid);border-radius:4px;position:relative}
.ar .tl i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--sc)}
.ar .t{font:400 .68rem var(--f-m);color:var(--mute);text-align:right;white-space:nowrap}
.mx{display:grid;grid-template-columns:minmax(70px,104px) repeat(4,minmax(0,1fr));gap:3px;font:400 .66rem var(--f-m);color:var(--mute);align-items:center}
.mx i{display:block;height:9px;border-radius:3px;background:var(--grid)}
.mx i.on{background:var(--tc)}
.daws{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.daw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.daw b{font:700 .76rem var(--f-d)}
.daw span{display:block;font-size:.8rem;color:var(--mute);margin-top:3px}
.toast{font:400 .76rem var(--f-m);color:var(--mute);min-height:1.3em;overflow-wrap:anywhere}
.fine{font-size:.78rem;color:var(--mute);max-width:84ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hello{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
